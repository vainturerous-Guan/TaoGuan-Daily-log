<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票监控与分析 · Stay Real and fun</title>
  <meta name="description" content="自选股监控、交易体系学习与复盘。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=20260916">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="site-name" href="index.html">Stay Real and fun</a>
      <button class="nav-toggle" aria-label="展开导航" aria-expanded="false">☰</button>
      <ul class="nav-links">
        <li><a href="daily.html">生活日常记录</a></li>
        <li><a href="goals.html">目标打卡</a></li>
        <li><a href="stocks.html" aria-current="page">股票监控与分析</a></li>
        <li><a href="knowledge.html">知识点积累</a></li>
        <li><a href="reading.html">读书笔记</a></li>
      </ul>
    </nav>
  </header>

  <main class="stocks-main">
    <div class="stocks-layout">
      <button class="drawer-toggle" id="drawer-toggle" aria-label="展开页签" aria-expanded="false">☰ 页签</button>
      <div class="drawer-overlay" id="drawer-overlay" hidden></div>

      <aside class="stocks-drawer" id="stocks-drawer" aria-label="股票频道页签">
        <nav class="drawer-nav">
          <button type="button" class="drawer-tab" data-tab="monitor">📊 股票监控</button>
          <button type="button" class="drawer-tab" data-tab="learning">📚 交易体系学习</button>
        </nav>
      </aside>

      <div class="stocks-content">
        <section class="tab-panel" id="panel-monitor" aria-label="股票监控">
          <iframe class="monitor-frame" src="stock-monitor.html" title="A股行情监控台"></iframe>
        </section>

        <section class="tab-panel" id="panel-learning" aria-label="交易体系学习" hidden>
          <section class="card form-card" aria-labelledby="learning-form-title">
            <h2 id="learning-form-title" class="card-title">记录交易体系学习</h2>
            <form id="learning-form" novalidate>
              <div class="form-row date-row">
                <div class="form-field date-field">
                  <label for="learning-date">日期</label>
                  <input type="date" id="learning-date" required>
                  <span class="weekday" id="learning-weekday"></span>
                </div>
                <div class="form-field">
                  <label for="learning-name">名称</label>
                  <input type="text" id="learning-name" placeholder="如：网格交易、止损纪律、仓位管理…" maxlength="100">
                </div>
              </div>

              <div class="form-field">
                <label for="learning-point">知识点</label>
                <textarea id="learning-point" rows="4" placeholder="今天学到的交易体系知识点，记下来～"></textarea>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="learning-submit">保存记录</button>
              </div>
            </form>
          </section>

          <section aria-labelledby="learning-history-title">
            <h2 id="learning-history-title" class="card-title history-title">历史记录</h2>
            <p id="learning-loading" class="loading-hint">加载中…</p>
            <div id="learning-list" class="record-list"></div>
            <p class="empty-hint" id="learning-empty" hidden>还没有学习记录，从今天的开始吧～</p>
          </section>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span class="current-year">2026</span> Stay Real and fun · 用心记录每一天</p>
  </footer>

  <script src="js/config.js?v=20260914"></script>
  <script src="js/common.js?v=20260914"></script>
  <script src="js/storage.js?v=20260914"></script>
  <script src="js/stocks.js?v=20260915"></script>
</body>
</html>

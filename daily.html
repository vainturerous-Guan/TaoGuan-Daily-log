<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="今日一句话总结、睡眠饮食、体重与每日记录。">

  <link rel="stylesheet" href="css/style.css?v=20261106b">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="site-name" href="index.html">Stay Real and fun</a>
      <button class="nav-toggle" aria-label="展开导航" aria-expanded="false">☰</button>
      <ul class="nav-links">
        <li><a href="goals.html">目标打卡</a></li>
        <li><a href="daily.html" aria-current="page">生活日常记录</a></li>
        <li><a href="stocks.html">股票监控与分析</a></li>
        <li><a href="knowledge.html">知识点积累</a></li>
        <li><a href="knowledge-graph/">知识图谱</a></li>
        <li><a href="reading.html">读书笔记</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1 class="page-title">生活日常记录</h1>

    <div class="page-tabs" role="tablist" aria-label="生活日常记录页签">
      <button type="button" class="page-tab" data-tab="today" aria-current="true">✏️ 今日感悟</button>
      <button type="button" class="page-tab" data-tab="history">📚 全部历史记录</button>
    </div>

    <section class="tab-panel" id="panel-today" aria-label="今日感悟">

    <section class="card form-card" aria-labelledby="form-title">
      <h2 id="form-title" class="card-title">今日感悟</h2>
      <form id="daily-form" novalidate>
        <div class="form-row date-row">
          <div class="form-field date-field">
            <label for="record-date">日期</label>
            <input type="date" id="record-date" required>
            <span class="weekday" id="weekday-display"></span>
          </div>
        </div>

        <fieldset class="form-field insights-group">
          <legend>生活感悟</legend>
          <p class="check-hint-sm">不一定每天有：小确幸、小情绪，或其他想先记下来、日后再整理的～</p>
          <div id="insights-list"></div>
          <button type="button" class="mini-btn" id="add-insight-btn">＋ 添加一条感悟</button>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">保存感悟</button>
          <button type="button" class="btn btn-ghost" id="cancel-edit-btn" hidden>取消编辑</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="history-title">
      <div class="section-head">
        <h2 id="history-title" class="card-title history-title">近5日记录</h2>
        <span class="unit-toggle" role="group" aria-label="体重单位">
          <button type="button" data-unit="jin" class="active">斤</button><button type="button" data-unit="kg">公斤</button>
        </span>
      </div>
      <div id="record-list" class="record-list">
        <p class="empty-hint" id="empty-hint" hidden>近5日还没有感悟，从今天的开始吧～</p>
      </div>
    </section>

    </section>

    <section class="tab-panel" id="panel-history" aria-label="全部历史记录" hidden>
      <div class="section-head">
        <h2 class="card-title history-title">全部历史记录</h2>
        <span class="unit-toggle" role="group" aria-label="体重单位">
          <button type="button" data-unit="jin" class="active">斤</button><button type="button" data-unit="kg">公斤</button>
        </span>
      </div>
      <div id="history-list" class="record-list">
        <p class="empty-hint" id="history-empty" hidden>还没有记录，从今天的开始吧～</p>
      </div>
      </div>
      <div class="pager" id="history-pager" hidden>
        <button type="button" class="mini-btn" data-page="prev">‹ 上一页</button>
        <span class="pager-info" id="page-info"></span>
        <button type="button" class="mini-btn" data-page="next">下一页 ›</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span class="current-year">2026</span> Stay Real and fun · 用心记录每一天</p>
  </footer>

  <script src="js/config.js?v=20261106b"></script>
  <script src="js/common.js?v=20261106b"></script>
  <script src="js/storage.js?v=20261106b"></script>
  <script src="js/daily.js?v=20261106b"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目标打卡 · Stay Real and fun</title>
  <meta name="description" content="每周工作与生活打卡，长期计划分阶段推进。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=20261013">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="site-name" href="index.html">Stay Real and fun</a>
      <button class="nav-toggle" aria-label="展开导航" aria-expanded="false">☰</button>
      <ul class="nav-links">
        <li><a href="daily.html">生活日常记录</a></li>
        <li><a href="goals.html" aria-current="page">目标打卡</a></li>
        <li><a href="stocks.html">股票监控与分析</a></li>
        <li><a href="knowledge.html">知识点积累</a></li>
        <li><a href="reading.html">读书笔记</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="page-title">目标打卡</h1>

    <div class="page-tabs" role="tablist" aria-label="目标打卡页签">
      <button type="button" class="page-tab" data-tab="checkin" aria-current="true">📝 本周打卡</button>
      <button type="button" class="page-tab" data-tab="plans">🎯 长期计划</button>
      <button type="button" class="page-tab" data-tab="history">📋 打卡历史</button>
    </div>

    <section class="tab-panel" id="panel-checkin" aria-label="本周打卡">

    <section class="card form-card" aria-labelledby="today-title">
      <div class="today-head">
        <h2 id="today-title" class="card-title">本周打卡</h2>
        <div class="today-date">
          <input type="date" id="checkin-date">
          <span class="weekday" id="checkin-weekday"></span>
          <span class="badge-today" id="today-badge">今天</span>
        </div>
      </div>

      <fieldset class="form-field checkin-group">
        <legend>工作事项</legend>
        <ul id="work-tasks" class="check-list"></ul>
        <form id="work-task-form" class="inline-add-form">
          <input type="text" id="work-task-input" placeholder="添加本周工作事项，回车保存" maxlength="100">
          <button type="submit" class="btn btn-small">添加</button>
        </form>
      </fieldset>

      <fieldset class="form-field checkin-group">
        <legend>生活</legend>
        <ul id="habit-list" class="check-list"></ul>
        <form id="habit-form" class="inline-add-form">
          <input type="text" id="habit-input" placeholder="新习惯，如：练琴" maxlength="20">
          <button type="submit" class="btn btn-small">添加</button>
        </form>
        <details class="archived-box" id="archived-box" hidden>
          <summary>已归档习惯</summary>
          <ul id="archived-list" class="check-list"></ul>
        </details>
      </fieldset>

      <p class="today-summary" id="today-summary"></p>
    </section>

    </section>

    <section class="tab-panel" id="panel-plans" aria-label="长期计划" hidden>
    <section aria-labelledby="long-title">
      <div class="section-head">
        <h2 id="long-title" class="card-title history-title">长期计划</h2>
        <button type="button" class="btn btn-small" id="add-plan-btn">＋ 新建计划</button>
      </div>
      <div id="plan-list" class="record-list"></div>
      <p class="empty-hint" id="plan-empty" hidden>还没有长期计划，点上方「＋ 新建计划」开始吧～</p>
    </section>
    </section>

    <section class="tab-panel" id="panel-history" aria-label="打卡历史" hidden>
      <div id="checkin-history" class="record-list"></div>
      <p class="empty-hint" id="checkin-history-empty" hidden>还没有打卡记录，从本周的开始吧～</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span class="current-year">2026</span> Stay Real and fun · 用心记录每一天</p>
  </footer>

  <script src="js/config.js?v=20260914"></script>
  <script src="js/common.js?v=20260914"></script>
  <script src="js/storage.js?v=20260914"></script>
  <script src="js/goals.js?v=20261027"></script>
</body>
</html>
